services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inscripciones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-clave-db}
      POSTGRES_DB: inscripciones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inscripciones -d inscripciones"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TYPE: postgres
      DATABASE_URL: postgres://inscripciones:${POSTGRES_PASSWORD:-cambia-esta-clave-db}@db:5432/inscripciones
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
      - app-logs:/app/logs
      - wa-session:/app/.whatsapp-session
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  app-logs:
  wa-session:
