name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      npm_config_loglevel: error
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validar credenciales de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          faltan=""
          [ -n "$VERCEL_TOKEN" ] || faltan="$faltan VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || faltan="$faltan VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || faltan="$faltan VERCEL_PROJECT_ID"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos de Vercel:$faltan"
            exit 1
          fi

          if ! npx --yes vercel@65 whoami --token "$VERCEL_TOKEN"; then
            echo "::error::VERCEL_TOKEN inválido o revocado: falló 'vercel whoami'. Regenerá el token en Vercel (Settings > Tokens) y actualizá el secreto de la repo."
            exit 1
          fi

          equipo=""
          case "$VERCEL_ORG_ID" in
            team_*) equipo="?teamId=$VERCEL_ORG_ID" ;;
          esac
          codigo=$(curl -sS -o /tmp/proyecto.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID$equipo")
          if [ "$codigo" != "200" ]; then
            echo "::error::No se pudo leer el proyecto (HTTP $codigo): revisá VERCEL_ORG_ID y VERCEL_PROJECT_ID."
            exit 1
          fi
          node -e "const p=require('/tmp/proyecto.json');console.log('Proyecto:',p.name,'| framework:',p.framework,'| node:',p.nodeVersion)"

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy a producción
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx --yes vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN" \
            -m "githubCommitSha=$GITHUB_SHA" \
            -m "githubCommitRef=$GITHUB_REF_NAME" \
            -m "githubCommitAuthorLogin=$GITHUB_ACTOR"
